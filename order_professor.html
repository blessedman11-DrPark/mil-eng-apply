<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>군사영어-발표 순서 관리</title>
  <link rel="stylesheet" href="css/style.css"/>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>
<body>
<header>
  <a href="mil_eng_apply.html" class="back-link">← 메인</a>
  <h1>발표 순서 관리</h1>
</header>

<main class="container" style="max-width:820px">

  <!-- 설정 -->
  <div class="section-card">
    <h2>신청 설정</h2>

    <div class="form-group">
      <label>총 발표 순번 수</label>
      <div class="input-row">
        <input type="number" id="total-input" min="1" max="200" style="max-width:120px"/>
        <button class="btn btn-primary btn-sm" id="save-total-btn">저장</button>
      </div>
    </div>

    <div class="form-group">
      <label>신청 받기</label>
      <div class="toggle-wrap">
        <label class="toggle">
          <input type="checkbox" id="open-toggle"/>
          <span class="toggle-slider"></span>
        </label>
        <span class="toggle-label" id="open-label">-</span>
      </div>
    </div>

    <div class="form-group" style="margin-bottom:0">
      <label>관리</label>
      <div style="display:flex;align-items:center;gap:.65rem;flex-wrap:wrap">
        <button class="btn btn-danger btn-sm" id="reset-btn">전체 초기화</button>
        <span class="text-muted">모든 배정을 지우고 다시 시작합니다.</span>
      </div>
    </div>
  </div>

  <!-- 현황 -->
  <div class="section-card">
    <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:.5rem;margin-bottom:1rem">
      <h2 style="margin:0">배정 현황 <span id="claimed-count" style="font-size:.85rem;color:#4a7fff;font-weight:600"></span></h2>
      <div style="display:flex;align-items:center;gap:.6rem;flex-wrap:wrap">
        <span class="text-muted" id="realtime-badge" style="font-size:.82rem"><span class="realtime-dot"></span>연결 중...</span>
        <button class="btn btn-secondary btn-sm" id="refresh-grid-btn">🔄 새로고침</button>
      </div>
    </div>
    <div id="order-grid" class="order-grid"></div>
  </div>

</main>

<div id="toast-container"></div>

<script src="js/config.js"></script>
<script src="js/supabase.js"></script>
<script src="js/order_professor.js"></script>
</body>
</html>
